[package]
name = "lastkey"
# Product version: always the next unshipped version (the post-release step
# moves it forward with each tag).
version = "1.0.3"
edition = "2024"
rust-version = "1.98"
license = "MIT"
default-run = "lastkey"

[features]
default = []
egui-ui = ["dep:eframe", "dep:egui", "dep:png"]
# Agent inspection: builds eframe's inspection plugin (`egui_inspection`) into
# the settings window so an external MCP client can read the widget tree and
# drive the UI. Two-step gate -- this feature at build time, `EGUI_INSPECTION`
# at run time (unset / `0` / `false` keeps it off; the default bind is
# loopback `127.0.0.1:5719`). Never enable it for a release build; see
# `src/ui/inspection.rs` for the full contract and the loopback warning.
agent-inspection = ["egui-ui", "eframe/inspection"]

[[bin]]
name = "lastkey"
path = "src/bin/lastkey.rs"

[[bin]]
name = "lastkey-settings"
path = "src/bin/lastkey-settings.rs"
required-features = ["egui-ui"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[target.'cfg(windows)'.dependencies]
# `default-features = false` plus an explicit minimum, verified against 0.36.2:
# `accesskit` is why the UI is egui -- without it the running
# window exposes zero UI Automation controls, the exact defect the migration
# exists to fix; `wgpu` is the renderer eframe's `Renderer` requires (dropping
# every backend is a compile_error!, and `wgpu_no_default_features` alone would
# leave no backend, as `dx12` arrives with `wgpu`'s own default); `default_fonts`
# supplies the bundled fallback faces behind the native Segoe UI face that
# `theme::fonts()` registers on top (F24), though egui's own default already
# enables it.
# The dropped defaults are unusable here: `links`, `wayland`, `x11` and
# `web_screen_reader` are for targets and features this Windows-only dependency
# never builds, and `winit/default` re-adds the Linux-only `x11`/`wayland` pair
# (`winit` still gets `rwh_06` from eframe's explicit feature string).
# Net: the `egui-ui` graph drops 37 crates, including the whole `links` ->
# `webbrowser` -> `url`/`idna`/`icu_*` chain and the glow/glutin renderer.
eframe = { version = "0.36.2", optional = true, default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
] }
egui = { version = "0.36.2", optional = true }
tray-icon = "0.24.2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"

[build-dependencies]
png = { version = "0.18.1", optional = true }
winres = "0.1"

[target.'cfg(windows)'.dev-dependencies]
egui_kittest = "0.36.2"
