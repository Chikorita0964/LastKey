[package]
name = "lastkey"
# Product version: always the next unshipped version (the post-release step
# moves it forward with each tag).
version = "1.0.3"
edition = "2024"
rust-version = "1.98"
license = "MIT"
default-run = "lastkey"

[features]
default = []
egui-ui = ["dep:eframe", "dep:egui", "dep:png"]

[[bin]]
name = "lastkey"
path = "src/bin/lastkey.rs"

[[bin]]
name = "lastkey-settings"
path = "src/bin/lastkey-settings.rs"
required-features = ["egui-ui"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[target.'cfg(windows)'.dependencies]
# `accesskit` is a default feature here; it is why the UI is egui and not iced.
eframe = { version = "0.36.2", optional = true }
egui = { version = "0.36.2", optional = true }
tray-icon = "0.24.2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"

[build-dependencies]
png = { version = "0.18.1", optional = true }
winres = "0.1"
