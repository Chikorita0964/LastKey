<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- SOCD Cyber Emblem (16x16 Pixel Art, Transparent Corners) -->
  <!-- Inner Black Background (14x14) -->
  <rect x="1" y="1" width="14" height="14" fill="#000000" />

  <g fill="#ffffff">
    <!-- Outer White Frame (Corners (0,0), (15,0), (0,15), (15,15) are transparent) -->
    <rect x="1" y="0" width="14" height="1" />
    <rect x="1" y="15" width="14" height="1" />
    <rect x="0" y="1" width="1" height="14" />
    <rect x="15" y="1" width="1" height="14" />
    <rect x="1" y="1" width="1" height="1" />
    <rect x="14" y="1" width="1" height="1" />
    <rect x="1" y="14" width="1" height="1" />
    <rect x="14" y="14" width="1" height="1" />

    <!-- 'S' (Top-Left, Rows 2-6) -->
    <rect x="2" y="2" width="5" height="1" />
    <rect x="3" y="3" width="1" height="1" />
    <rect x="3" y="4" width="3" height="1" />
    <rect x="5" y="5" width="1" height="1" />
    <rect x="2" y="6" width="5" height="1" />

    <!-- 'O' (Top-Right, Rows 2-6) -->
    <rect x="10" y="2" width="3" height="1" />
    <rect x="9" y="3" width="2" height="1" />
    <rect x="13" y="3" width="1" height="1" />
    <rect x="9" y="4" width="1" height="1" />
    <rect x="13" y="4" width="1" height="1" />
    <rect x="9" y="5" width="1" height="1" />
    <rect x="12" y="5" width="2" height="1" />
    <rect x="10" y="6" width="3" height="1" />

    <!-- 'C' (Bottom-Left, Rows 9-13) -->
    <rect x="2" y="9" width="1" height="1" />
    <rect x="4" y="9" width="3" height="1" />
    <rect x="3" y="10" width="1" height="3" />
    <rect x="2" y="13" width="1" height="1" />
    <rect x="4" y="13" width="3" height="1" />

    <!-- 'D' (Bottom-Right, Rows 9-13) -->
    <rect x="9" y="9" width="3" height="1" />
    <rect x="13" y="9" width="1" height="1" />
    <rect x="9" y="10" width="1" height="3" />
    <rect x="12" y="10" width="1" height="3" />
    <rect x="9" y="13" width="3" height="1" />
    <rect x="13" y="13" width="1" height="1" />
  </g>
</svg>
