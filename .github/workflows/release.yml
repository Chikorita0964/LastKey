name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Current version: v1.0.1. Next release tag to create.
        required: true
        default: v1.0.2
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  socd-state-tests:
    uses: ./.github/workflows/socd-state-tests.yml

  release:
    needs: socd-state-tests
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_BRANCH: ${{ github.ref_name }}
      RELEASE_REF_TYPE: ${{ github.ref_type }}
    steps:
      - name: Require workflow update token
        env:
          RELEASE_WORKFLOW_TOKEN: ${{ secrets.RELEASE_WORKFLOW_TOKEN }}
        run: |
          if (-not $env:RELEASE_WORKFLOW_TOKEN) {
            throw 'The RELEASE_WORKFLOW_TOKEN secret is required to update release.yml after a release.'
          }
      - uses: actions/checkout@v7.0.1
        with:
          # Updating a file under .github/workflows requires the Workflows
          # permission, which is not available to the built-in GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_WORKFLOW_TOKEN }}

      # windows-latest can also provide MinGW on PATH.  Select MSVC explicitly,
      # because this project uses MSVC compiler options and Windows resources.
      - name: Locate Visual Studio developer environment
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installationPath) { throw 'Visual Studio C++ build tools were not found.' }

          $devCmd = Join-Path $installationPath 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $devCmd)) { throw 'Visual Studio developer environment script was not found.' }
          "VSDEVCMD=$devCmd" >> $env:GITHUB_ENV

      - name: Validate release
        run: |
          if ($env:RELEASE_REF_TYPE -ne 'branch') {
            throw 'The release workflow must be run from a branch so its default tag can be updated.'
          }

          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Release tags must use vMAJOR.MINOR.PATCH format.' }

          # Without --exit-code, an absent tag remains a successful query.
          $tagRef = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tagRef) { throw "Tag $env:RELEASE_TAG already exists." }

          "VERSION=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_ENV
      - name: Configure release build
        shell: cmd
        run: >
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64 && cmake -G Ninja -S . -B out/cmake-release
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DLASTKEY_INCLUDE_VERSION=ON
          -DLASTKEY_VERSION=%VERSION%
      - name: Build release
        shell: cmd
        run: call "%VSDEVCMD%" -arch=x64 -host_arch=x64 && cmake --build out/cmake-release
      - name: Package release
        run: |
          New-Item -ItemType Directory -Path release/package | Out-Null
          Copy-Item -LiteralPath LICENSE -Destination release/package/LICENSE.txt
          Copy-Item -LiteralPath out/cmake-release/LastKey.exe -Destination release/package/LastKey.exe
          Compress-Archive -LiteralPath release/package/LastKey.exe, release/package/LICENSE.txt -DestinationPath "release/LastKey-$env:VERSION.zip"
      - name: Package MSIX
        run: |
          # The Store signs this package after it passes certification.
          .\msix\package-msix.ps1 `
            -Version $env:VERSION `
            -Executable out/cmake-release/LastKey.exe `
            -OutputDirectory release
      - name: Upload Store submission package
        uses: actions/upload-artifact@v4
        with:
          name: LastKey-${{ inputs.tag }}-msix
          path: release/LastKey-*.msix
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "release/LastKey-$env:VERSION.zip"
          )
          gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --generate-notes
      - name: Update the next release form default
        run: |
          function Invoke-Git {
            param(
              [Parameter(Mandatory, ValueFromRemainingArguments)]
              [string[]]$Arguments
            )

            & git @Arguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          Invoke-Git fetch origin $env:RELEASE_BRANCH
          Invoke-Git checkout -B release-version-update "origin/$env:RELEASE_BRANCH"

          $nextReleaseTag = .\.github\scripts\Update-ReleaseFormDefault.ps1 -ReleaseTag $env:RELEASE_TAG

          Invoke-Git config user.name 'github-actions[bot]'
          Invoke-Git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          Invoke-Git add -- .github/workflows/release.yml

          git diff --cached --quiet -- .github/workflows/release.yml
          $diffExitCode = $LASTEXITCODE
          if ($diffExitCode -eq 0) { exit 0 }
          if ($diffExitCode -ne 1) { exit $diffExitCode }

          Invoke-Git commit -m "chore(release): prepare $nextReleaseTag"
          Invoke-Git push origin "HEAD:$env:RELEASE_BRANCH"
