name: Rust tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Format
        run: cargo fmt --all -- --check
      - name: Default tests
        run: cargo test --all-targets
      - name: Default lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Settings UI tests
        run: cargo test --no-default-features --features iced-ui --lib --bin lastkey-settings
      - name: Settings UI lint
        run: cargo clippy --no-default-features --features iced-ui --lib --bin lastkey-settings -- -D warnings
      - name: Check Linux backend
        run: cargo check --target x86_64-unknown-linux-gnu --lib
