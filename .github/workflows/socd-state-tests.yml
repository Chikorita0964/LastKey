name: SOCD state tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  socd-state-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # windows-latest can also provide MinGW on PATH.  Select MSVC explicitly,
      # because this project uses MSVC compiler options and Windows resources.
      - name: Locate Visual Studio developer environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installationPath) { throw 'Visual Studio C++ build tools were not found.' }

          $devCmd = Join-Path $installationPath 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $devCmd)) { throw 'Visual Studio developer environment script was not found.' }
          "VSDEVCMD=$devCmd" >> $env:GITHUB_ENV
      - name: Configure tests
        shell: cmd
        run: call "%VSDEVCMD%" -arch=x64 -host_arch=x64 && cmake -G Ninja -S . -B out/cmake-tests -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build tests
        shell: cmd
        run: call "%VSDEVCMD%" -arch=x64 -host_arch=x64 && cmake --build out/cmake-tests
      - name: Run state-transition tests
        shell: cmd
        run: call "%VSDEVCMD%" -arch=x64 -host_arch=x64 && ctest --test-dir out/cmake-tests --output-on-failure
